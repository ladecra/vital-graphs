schema_version: "1"

system:
  name: Insulin–glucose regulation
  description: Simplified postprandial glucose homeostasis

nodes:
  - id: blood_glucose
    label: Blood glucose
  - id: pancreatic_beta_cells
    label: Pancreatic beta cells
  - id: insulin
    label: Insulin
  - id: peripheral_uptake
    label: Peripheral glucose uptake

edges:
  - from: blood_glucose
    to: pancreatic_beta_cells
    relation: stimulates
  - from: pancreatic_beta_cells
    to: insulin
    relation: stimulates
  - from: insulin
    to: peripheral_uptake
    relation: stimulates
  - from: peripheral_uptake
    to: blood_glucose
    relation: inhibits
